[package]
name = "framework-control-native"
version = "1.6.0"
edition = "2021"
description = "Native desktop client for the Framework Control service (no browser required)"
license = "MIT"

[[bin]]
name = "framework-control-app"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_plot = "0.31"
# SVG icons (Fluent UI System Icons, as used by White Rabbit)
egui_extras = { version = "0.31", default-features = false, features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[target.'cfg(windows)'.dependencies]
# Native "Browse…" file picker for locating companion tools.
rfd = { version = "0.15", default-features = false }
# Windows accent colour and light/dark setting, read the way White Rabbit does
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
