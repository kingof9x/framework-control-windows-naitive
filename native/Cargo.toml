[package]
name = "framework-control-native"
version = "1.0.0"
edition = "2021"
description = "Native desktop client for the Framework Control service (no browser required)"
license = "MIT"

[[bin]]
name = "framework-control-app"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_plot = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
