# Upstream feature-parity manifest for the native app.
#
# Every upstream API operation, web UI source file (read from upstream git;
# this repo doesn't keep web/) and config field must be listed here (or, for config fields, mirrored in native/src/api.rs).
# `tools/parity/parity.py check` fails when something new appears upstream
# that isn't accounted for, so ports don't silently fall behind.
#
# status = "ported"   -> implemented in the native app (`native` says where)
#          "omitted"  -> deliberately not ported (`note` says why)
#          "internal" -> web-only plumbing with no user-visible feature

[upstream]
repo = "https://github.com/ozturkkl/framework-control"
branch = "main"
# Last upstream commit whose changes have been reviewed and ported.
synced_commit = "b29db7376449a635c84a39e6922d496d92e94436"
synced_version = "0.5.5"

# ---------------------------------------------------------------- API ---
# Keyed by operation_id in service/src/routes.rs.

[api.health]
status = "ported"
native = "native/src/state.rs (poller), header status dot"

[api.getPower]
status = "ported"
native = "native/src/pages/power.rs, battery.rs, overview.rs"

[api.getThermal]
status = "ported"
native = "native/src/calibration.rs (live RPM during calibration)"

[api.getThermalHistory]
status = "ported"
native = "native/src/pages/overview.rs, fans.rs"

[api.getBatteryHistory]
status = "ported"
native = "native/src/pages/battery.rs"

[api.getVersions]
status = "ported"
native = "header + Settings > Device"

[api.getConfig]
status = "ported"
native = "native/src/state.rs (polled every 5 s)"

[api.setConfig]
status = "ported"
native = "native/src/app.rs autosave + Settings"

[api.getConfigEvents]
status = "omitted"
note = "SSE multi-tab sync; the native app polls /config every 5 s instead."

[api.getSystemInfo]
status = "ported"
native = "Settings > Device"

[api.checkUpdate]
status = "ported"
native = "Settings > Updates, header badge"

[api.applyUpdate]
status = "ported"
native = "Settings > Updates > Install"

[api.installRyzenadj]
status = "ported"
native = "native/src/pages/power.rs"

[api.uninstallRyzenadj]
status = "ported"
native = "native/src/pages/power.rs"

[api.getFrameworkToolVersions]
status = "ported"
native = "Settings > Updates > framework_tool (Check for updates)"
note = "Only fetched when the user checks for updates (it asks GitHub), not on every visit to Settings."

[api.switchFrameworkToolVersion]
status = "ported"
native = "Settings > Updates > framework_tool (Update to / version list)"
note = "Upstream's 'Latest' (the service checks GitHub on every start) isn't offered: the app pins the installed version once and updates are manual."

[api.getLogs]
status = "ported"
native = "Settings > Logs window"

[api.getShortcutsStatus]
status = "omitted"
note = "The MSI creates Start Menu/Desktop shortcuts to the native app."

[api.createShortcuts]
status = "omitted"
note = "Creates browser app-mode shortcuts; the MSI makes native shortcuts instead."

