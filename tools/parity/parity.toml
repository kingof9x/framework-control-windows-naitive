# ---------------------------------------------------------- Config ---
# Config fields (service/src/types.rs) that the native types in
# native/src/api.rs intentionally don't model. They still round-trip through
# `extra` maps or aren't sent at all.

[config_ignore]
"Config.version" = "Schema version; preserved via Config.extra."
"UiConfig.announcements" = "Web 'what's new' state; preserved via UiConfig.extra."
"AnnouncementsConfig.*" = "See UiConfig.announcements."
"FanControlPatch.*" = "Request type; the native app sends JSON patches."
"PartialConfig.*" = "Request type; the native app sends JSON patches."
