name: Build and release

# Builds the native app + MSI on every push/PR that touches it. To publish a
# release: Actions > Build and release > Run workflow. The version box says
# "next" (last release + 1); type a number to choose one, or clear it to only
# test the build. The version is written into native/Cargo.toml for the build,
# so the MSI and the app report it. The service's updater (and the app's
# Settings page) look for the .msi asset on the latest release.

on:
  push:
    paths:
      - "native/**"
      - "service/**"
      - "tools/parity/**"
      - ".github/workflows/native-release.yml"
  pull_request:
    paths:
      - "native/**"
      - "service/**"
      - "tools/parity/**"
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version. "next" = last release + 1 (for example 1.3 after 1.2), or type one (for example 2.0). Empty = only test the build, no release.'
        required: false
        default: 'next'

permissions:
  contents: write

jobs:
  version:
    # Works out the release version: from the Run workflow box ("next" = last release + 1)
    # or from a pushed v* tag. Empty means "only test the build, no release".
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT: ${{ inputs.version }}
        run: |
          v=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v=$(printf '%s' "$GITHUB_REF_NAME" | grep -oE '[0-9]+(\.[0-9]+)*$' || true)
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$INPUT" ]; then
            if [ "$INPUT" = next ]; then
              last=$(gh api "repos/$REPO/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false) | .tag_name][0] // ""')
              num=$(printf '%s' "$last" | grep -oE '[0-9]+(\.[0-9]+)*$' || true)
              if [ -z "$num" ]; then v=1.0; else v=$(printf '%s' "$num" | awk -F. -v OFS=. '{$NF=$NF+1; print}'); fi
              echo "Last release: ${last:-none}"
            else
              v="${INPUT#[vV]}"
            fi
          fi
          if [ -n "$v" ] && ! printf '%s' "$v" | grep -qE '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::'$v' is not a version number. Use numbers like 1.4 or 2.0.1, or 'next'."; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=${v:+v$v}" >> "$GITHUB_OUTPUT"
          if [ -n "$v" ]; then echo "### Releasing v$v" >> "$GITHUB_STEP_SUMMARY"; else echo "### Test build only, no release" >> "$GITHUB_STEP_SUMMARY"; fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Install GUI build deps
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev
      - name: Unit tests
        working-directory: native
        run: cargo test
      - name: Upstream parity check
        run: python3 tools/parity/parity.py check

  build-windows:
    needs: version
    runs-on: windows-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            service
      - name: Set the release version
        if: needs.version.outputs.version != ''
        shell: bash
        run: |
          v="${{ needs.version.outputs.version }}"
          case "$v" in *.*.*) ;; *.*) v="$v.0" ;; *) v="$v.0.0" ;; esac
          sed -i -E '0,/^version = ".*"/s//version = "'"$v"'"/' native/Cargo.toml
          awk -v v="$v" 'prev=="name = \"framework-control-native\"" && /^version = / {$0="version = \"" v "\""} {print; prev=$0}' native/Cargo.lock > native/Cargo.lock.new && mv native/Cargo.lock.new native/Cargo.lock
          grep -m1 '^version' native/Cargo.toml
      - name: Install WiX Toolset v3
        run: choco install wixtoolset --no-progress -y
      - name: Build MSI
        id: build
        shell: pwsh
        run: ./native/installer/build-msi.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: framework-control-windows
          path: native/dist/*
          if-no-files-found: error

  release:
    needs: [version, test, build-windows]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: framework-control-windows
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Run again with a newer version (or leave 'next')."
            exit 1
          fi
          notes=$(awk "/^## $VERSION(\$| )/{f=1; next} /^## /{f=0} f" native/CHANGELOG.md || true)
          [ -n "$notes" ] || notes="Framework Control $VERSION"
          gh release create "$tag" dist/* \
            --title "Framework Control $VERSION" \
            --notes "$notes" \
            --target "$GITHUB_SHA" \
            --latest
